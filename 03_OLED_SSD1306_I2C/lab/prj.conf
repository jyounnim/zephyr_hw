# OLED SSD1306 (I2C mode, address auto-detect) - project configuration

CONFIG_I2C=y
CONFIG_GPIO=y

# UART console backend for printk() output.
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# NOTE: this lab talks to the SSD1306 with raw i2c_write() calls
# (control byte + command/data), not Zephyr's Display/CFB subsystem -
# see the devicetree overlay and main.c header comments for why
# (runtime address scan across 0x3C/0x3D).
