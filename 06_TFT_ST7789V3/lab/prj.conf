# TFT ST7789V3 (SPI, 240x280) - project configuration

CONFIG_SPI=y
CONFIG_GPIO=y

# st7789_fill_rect() keeps a one-row (240px * 2 bytes/px = 480 byte)
# stack buffer rather than a full-screen framebuffer; bump the main
# stack a bit to keep headroom alongside that plus the smaller
# per-character buffer in st7789_draw_char().
CONFIG_MAIN_STACK_SIZE=4096

# UART console backend for printk() output.
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# NOTE: this lab talks to the ST7789V3 with raw spi_write_dt() calls
# (command/data selected via the DC pin), not Zephyr's Display/CFB
# subsystem or the in-tree "sitronix,st7789v" driver - see the
# devicetree overlay and main.c header comments.
