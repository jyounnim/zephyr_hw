sample:
  description: Scan I2C0 for connected devices once at boot, from a dedicated thread
  name: i2c_bus_scanner
common:
  tags:
    - i2c
tests:
  sample.i2c.bus_scanner:
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
    harness: console
    harness_config:
      type: one_line
      regex:
        - "=== I2C Bus Scanner \\(ESP32-S3\\) ==="
