# I2C Bus Scanner - project configuration

CONFIG_I2C=y

# Explicitly enabled to match a known-good reference sample
# (user-provided i2c_test), even though this driver was already being
# linked in transitively (I2C1 already has a PCA6416A child device
# using it). Keeping it explicit removes any doubt.
CONFIG_I2C_DW=y

# UART console backend for printk() output.
CONFIG_UART_CONSOLE=y

CONFIG_PRINTK=y

# NOTE: no interactive input is used (see main.c) - a UART-based
# selection menu (both console_getline() and a raw uart_poll_in()
# loop) proved unreliable on this board: garbage bytes kept arriving
# on RX with no keypress. The sample now auto-scans both buses in a
# loop instead, so CONFIG_CONSOLE / CONFIG_CONSOLE_GETLINE are not
# needed at all.
